plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.pst10101.chzzktranslator'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.pst10101.chzzktranslator'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        // Only our own UI languages (androidx would otherwise bundle ~90 locales)
        resourceConfigurations += ['en', 'ko', 'ja']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Origin-restricted JS bridge (addWebMessageListener / addDocumentStartJavaScript)
    implementation 'androidx.webkit:webkit:1.11.0'
}

// chat-utils.js is shared with the Chrome extension: copy it from the repo root at build time.
tasks.register('copySharedJs', Copy) {
    from("${rootDir}/../chat-utils.js")
    into("${projectDir}/src/main/assets")
}
preBuild.dependsOn copySharedJs
