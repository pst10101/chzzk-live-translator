plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.pst10101.chzzktranslator'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.pst10101.chzzktranslator'
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName '1.1.0'
        // Only our own UI languages (androidx would otherwise bundle ~90 locales)
        resourceConfigurations += ['en', 'ko', 'ja']
        // Phones only (the on-device text recognition model is ~4 MB per architecture)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // On-device Korean text recognition for reading the chat off the screen (bundled model: works offline,
    // no Google Play download step; screen pictures never leave the phone)
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}

// The built-in StelLive glossary is shared with the extension too.
tasks.register('copyGlossary', Copy) {
    from("${rootDir}/../glossary") { include 'stellive-*.txt' }
    into("${projectDir}/src/main/assets/glossary")
}
preBuild.dependsOn copyGlossary
